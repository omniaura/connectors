name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: |
          (cd adapters/agentflow && GOWORK=off go mod tidy)
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum adapters/agentflow/go.mod adapters/agentflow/go.sum
      - name: vet
        run: go vet ./... ./adapters/agentflow/...
      - name: test
        run: go test -race -count=1 ./... ./adapters/agentflow/...
